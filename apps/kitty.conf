font_size {{terminal_font_size}}

cursor_blink_interval 0
cursor_trail 200
cursor_trail_decay 0.3 0.5
enable_audio_bell no
remember_window_size no
initial_window_width 1000
initial_window_height 700

map cmd+w no_op
map cmd+r no_op

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+a>h show_scrollback
map ctrl+shift+[ previous_tab
map ctrl+shift+] next_tab

enabled_layouts grid, stack
map ctrl+shift+y next_layout

# Navigate between windows (splits) within a tab
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Move the active window in that direction (tiling-WM style)
map ctrl+shift+alt+h move_window left
map ctrl+shift+alt+k move_window up
map ctrl+shift+alt+j move_window down
map ctrl+shift+alt+l move_window right

# Jump straight to the nth tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

map ctrl+shift+equal change_font_size current +1.0
map ctrl+shift+minus change_font_size current -1.0

map ctrl+shift+a>s save_as_session --use-foreground-process --base-dir $XDG_CONFIG_HOME/kitty/sessions/
map ctrl+shift+a>l goto_session

map super+1 discard_event
map super+2 discard_event
map super+3 discard_event
map super+4 discard_event
map super+5 discard_event
map super+6 discard_event
map super+7 discard_event
map super+8 discard_event
map super+9 discard_event

map super+k neighboring_window up
map super+j neighboring_window down

background #{{colors.background}}
foreground #{{colors.foreground}}

selection_background #{{colors.foreground}}
selection_foreground #{{colors.background}}

cursor #{{colors.cursor}}
cursor_text_color background

# Tabs as filled, rounded boxes (powerline pills)
active_tab_background #{{colors.bg_accent}}
active_tab_foreground #{{colors.foreground}}
active_tab_font_style bold
inactive_tab_background #{{colors.black}}
inactive_tab_foreground #{{colors.foreground}}
inactive_tab_font_style normal

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_height 2.0 0.0

tab_title_template        "{fmt.fg._{{colors.purple}}}[{index}]{fmt.fg.default} {title}{' · {}w'.format(num_windows) if layout_name == 'stack' else ''}"
active_tab_title_template "{fmt.fg._{{colors.green}}}[{index}]{fmt.fg.default} {title}{' · {}w'.format(num_windows) if layout_name == 'stack' else ''}"

# Black
color0 #{{colors.black}}
color8 #{{colors.gray}}

# Red
color1 #{{colors.red}}
color9 #{{colors.red}}

# Green
color2 #{{colors.green}}
color10 #{{colors.green}}

# Yellow
color3 #{{colors.orange}}
color11 #{{colors.yellow}}

# Blue
color4 #{{colors.blue}}
color12 #{{colors.blue}}

# Magenta
color5 #{{colors.purple}}
color13 #{{colors.purple}}

# Cyan
color6 #{{colors.cyan}}
color14 #{{colors.cyan}}

# White
color7 #{{colors.white}}
color15 #{{colors.foreground}}
